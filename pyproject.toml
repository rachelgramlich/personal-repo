[project]
name = "grocery-wizard"
version = "0.0.0"
description = "Notion-driven meal planning and grocery lists"
requires-python = ">=3.12,<3.13"

dependencies = [
    "beautifulsoup4>=4.12.3",
    "ingredient-parser-nlp>=2.7.0",
    "loguru>=0.7.2",
    "notion-client>=2.2.1",
    "pytest>=8.2.2",
    "pydantic-settings>=2.7.0",
    "python-dotenv>=1.0.1",
    "requests>=2.32.3",
    "ruff>=0.15.6",
    "streamlit>=1.39.0",
]


[project.optional-dependencies]
dev = [
    "mypy>=1.11",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "N",    # PEP 8 naming
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific rules
    "C4",   # flake8-comprehensions
    "PIE",  # flake8-pie
    "RET",  # flake8-return
    "ISC",  # flake8-implicit-str-concat
    "PGH",  # pygrep-hooks
    "DTZ",  # flake8-datetimez
    "PERF", # perflint
    "FLY",  # flynt (f-string conversions)
    "PT",   # flake8-pytest-style
    "PLR",  # pylint refactor
    "PLE",  # pylint errors
    "PLW",  # pylint warnings
    "TRY",  # tryceratops
    "EM",   # flake8-errmsg
    "FURB", # refurb (modernise patterns)
    "ANN",  # flake8-annotations
]
ignore = [
    "EM101",
    "EM102",
    "TRY003",
    "PLR2004",
    "PLR0912",
    "PLR0913",
    "PLR0915",
    "PLR0911",
    "SIM108",
    "ANN401",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["E501", "PLR2004", "ANN"]
"src/grocery_wizard/ui/app.py" = ["E402"]

[tool.ruff.lint.flake8-annotations]
allow-star-arg-any = true
mypy-init-return = true
suppress-dummy-args = true
suppress-none-returning = true

[tool.ruff.format]
docstring-code-format = true

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
